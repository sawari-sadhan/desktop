services:
  sawari-desktop:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_AUTH_API_URL=https://auth.sawarisadhan.com
        - NEXT_PUBLIC_CORE_API_URL=https://core.sawarisadhan.com
        - NEXT_PUBLIC_MEDIA_API_URL=https://media.sawarisadhan.com
    container_name: sawari-desktop
    restart: always
    ports:
      - "5111:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_AUTH_API_URL=http://localhost:5101
      - NEXT_PUBLIC_CORE_API_URL=http://localhost:5102
      - NEXT_PUBLIC_MEDIA_API_URL=http://localhost:5100
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
